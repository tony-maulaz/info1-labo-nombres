# Constant shim: no lab information here, the checks live in criteria.yml.
# Every push gives indicative feedback; the graded run is dispatched by the
# Quiz platform (quiz-grade) at the deadline. Protected: a change is reverted.
name: grading
on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [quiz-grade]
run-name: grading ${{ github.event.client_payload.nonce || github.sha }}

jobs:
  grading:
    uses: heig-tin-info/score/.github/workflows/run.yml@de3693485ec1bd51c61cf546fdf1fdd8690f3951 # 1.0.0
